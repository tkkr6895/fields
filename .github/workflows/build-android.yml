name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build signed sideload APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Name APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/Fields.apk
          ls -lh dist-apk/Fields.apk

      - name: Upload Fields.apk
        uses: actions/upload-artifact@v4
        with:
          name: Fields-apk
          path: dist-apk/Fields.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish sideload release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sideload
          name: Fields APK (sideload)
          files: dist-apk/Fields.apk
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Direct APK for the phone. **Do not install the Actions zip.**

            1. Uninstall any older Fields app first (debug builds used a different signature).
            2. Download **Fields.apk** from this release (not from Actions artifacts).
            3. Open the file on the phone → Allow from this source → Install.
            4. If Play Protect warns, choose Install anyway. This is a sideload build, not Play Store.

            Grant **precise location** (and **Allow all the time** if you hike with the screen off). Camera is optional.

      - name: Create GitHub Release (version tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/Fields.apk
          generate_release_notes: true
