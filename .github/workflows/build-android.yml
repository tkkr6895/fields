name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build signed sideload APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Name APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/Fields.apk
          cp .github/INSTALL-APK.txt dist-apk/INSTALL.txt
          ls -lh dist-apk/

      - name: Upload Fields APK (Actions)
        uses: actions/upload-artifact@v6
        with:
          name: Fields
          path: dist-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish sideload release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: sideload
          name: Fields APK (sideload)
          files: dist-apk/Fields.apk
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Signed Android APK. Prefer this file over the Actions artifact (GitHub wraps artifacts in a zip).

            Enable unknown sources, then open **Fields.apk**. Grant precise location (background location if recording with the screen off). Camera is optional.

            If Android rejects the install, a previous Fields build signed with a different key is still on the device — uninstall that build, then install this APK.

            Same binary is also the Actions artifact **Fields** (`Fields.zip` → extract `Fields.apk`; do not install the zip).

      - name: Create GitHub Release (version tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-apk/Fields.apk
          generate_release_notes: true
